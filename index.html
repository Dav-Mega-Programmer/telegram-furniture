<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0bb79f" />
  <meta name="description" content="Westwoods — каталог мебели и заказ в Telegram" />
  <title>Westwoods — мебель на заказ</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">W</div>
        <div>
          <div class="brand-name">Westwoods</div>
          <div class="brand-sub">Aram · мебель на заказ</div>
        </div>
      </div>
      <button class="icon-btn" id="shareBtn" aria-label="Поделиться">↗</button>
    </header>

    <main id="app" class="content"></main>

    <nav class="bottom-nav" aria-label="Основная навигация">
      <button class="nav-item active" data-tab="home"><span>⌂</span><small>Главная</small></button>
      <button class="nav-item" data-tab="catalog"><span>▦</span><small>Каталог</small></button>
      <button class="nav-item" data-tab="favorites"><span>♡</span><small>Избранное</small></button>
      <button class="nav-item" data-tab="contacts"><span>◌</span><small>Контакты</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" data-close-modal aria-label="Закрыть">×</button>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
